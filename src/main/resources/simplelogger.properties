# Logging configuration for JGit, which is the only thing in this program that logs through slf4j.
# The program's own narration goes through Progress (stderr, controlled by --quiet/--verbose), so
# this file exists to keep the library quiet on a normal run without discarding what it has to say
# when a repository turns out to be malformed.

# JGit's INFO chatter would compete with Progress for stderr; its warnings are worth seeing.
org.slf4j.simpleLogger.defaultLogLevel=warn

# stderr, like every other line the program writes that is not a result.
org.slf4j.simpleLogger.logFile=System.err

# A single-threaded CLI has no use for a thread name, and the timestamp belongs to the shell.
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showDateTime=false

# "[WARN] FileSnapshot - ..." — the bracket and the class name mark the line as JGit's rather than
# ours, since Progress prefixes its own with "git-timebraid: ".
org.slf4j.simpleLogger.levelInBrackets=true
org.slf4j.simpleLogger.showShortLogName=true
