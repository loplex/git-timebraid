name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: verify (JDK ${{ matrix.java }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: ["17", "21"]
        # jlink spells its compression differently across these two: `zip-6` needs JDK 21, and a
        # JDK 17 build has to ask for the older numeric form. A release only ever uses 21's, and the
        # numeric one is what a JDK 17 build from source needs, so both are exercised.
        include:
          - java: "17"
            jlink_compress: "2"
          - java: "21"
            jlink_compress: "zip-6"

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # The tests run `git`: for fsck, log --graph and the other commands that read what the output
      # holds, and through the program for a clone, --keep-remotes and --no-bare. It is preinstalled
      # on the GitHub-hosted runners; this just records the version.
      - name: Show git version
        run: git --version

      # Not a nicety ahead of the compiler: this catches what the compiler does not. Kotlin nests
      # block comments, so `/` followed by `*` in a KDoc -- how a ref glob is written -- opens one
      # that swallows what follows. Any `*/` below it closes that comment again, and where what
      # remains parses, the file compiles with a hole in it and nothing is reported. A @Test can
      # stop running while the build stays green. Where it does fail, it fails as `Unclosed comment`
      # at the last line and a syntax error far above the glob, so this says the line either way.
      #
      # Linux only: it reads the tracked sources, which do not differ per platform.
      - name: Check no block comment opens another
        if: runner.os == 'Linux'
        run: .github/scripts/check-comments.sh

      - name: mvn verify
        run: mvn -B -ntp verify

      - uses: ./.github/actions/render-man-html
        if: runner.os != 'Windows'

      # The bundled-runtime profile is the part of the build most likely to fail on a platform
      # rather than in code: it shells out to jlink, names its archive from the os/arch profiles,
      # and links a hand-written module list. Building it in the same matrix that runs the tests
      # means the archives a release uploads for Linux x64 and macOS aarch64 have been built on
      # their platform already; the Linux aarch64 and macOS x64 ones are built only by the release
      # workflow. The Windows one is linked on Linux, as the release links it, by the jobs below.
      - name: Build the bundled-runtime archive
        if: runner.os != 'Windows'
        run: mvn -B -ntp -DskipTests -Pbundled-runtime "-Djlink.compress=${{ matrix.jlink_compress }}" package

      # jlink proves the image links, not that it runs. The script unpacks the archive a user
      # would download and merges two repositories with it; it lives in .github/scripts/ so that
      # anything else building these archives can make the very same check about them.
      - name: Merge two repositories with the unpacked archive
        if: runner.os != 'Windows'
        shell: bash
        run: .github/scripts/smoke-distribution.sh

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-${{ matrix.os }}-jdk${{ matrix.java }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore

  # The Windows archive as the release builds it: linked on Linux from the jmods of the Windows JDK
  # of the same version, so that a release's Windows leg is not the first run of that path. JDK 21
  # only, the release's; the matrix above covers jlink on 17.
  windows-archive:
    name: windows-x64 archive, linked on Linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: ./.github/actions/render-man-html

      # Assigned before it is used: a failing substitution inside an argument would leave the
      # build to run on the jmods of this JDK instead, and name a Linux image for Windows.
      - name: Build the bundled-runtime archive
        shell: bash
        run: |
          set -euo pipefail
          jmods=$(.github/scripts/fetch-jmods.sh windows x64 "$RUNNER_TEMP/jdk")
          mvn -B -ntp -DskipTests -Pbundled-runtime "-Djlink.jmods=$jmods" -Ddist.os=windows -Ddist.arch=x64 package

      - uses: actions/upload-artifact@v7
        with:
          name: bundled-windows-x64
          path: target/git-timebraid-*-windows-x64.tar.gz
          if-no-files-found: error

  # The archive above, run where it is for: the smoke test the other platforms run on the archive
  # they built.
  windows-archive-runs:
    name: windows-x64 archive runs
    needs: windows-archive
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: bundled-windows-x64
          path: target

      - name: Merge two repositories with the unpacked archive
        shell: bash
        run: .github/scripts/smoke-distribution.sh

  # Two places quote the tool's own output to a reader as something they can reproduce: the worked
  # examples, and the option list in doc/usage.md. `mvn verify` proves the behaviour; it says
  # nothing about whether the documents still describe that behaviour correctly, and those are
  # different claims. This job rebuilds the fixtures, replays every invocation the READMEs
  # document, compares what came back against what they show, and checks the option list against
  # what `--help` actually prints.
  #
  # One platform and one JDK on purpose: the fixtures are built by a bash script and the outputs
  # hold the same commits by design, so a second platform would re-check determinism the matrix
  # above already covers, while adding a Windows bash dependency to the examples that they do not
  # have.
  examples:
    name: examples reproduce
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Show git version
        run: git --version

      # One packaged jar rather than a Maven JVM per invocation: check-examples.py runs every
      # documented `./git-timebraid` line as `java -jar target/git-timebraid.jar`, which is what
      # the wrapper in the repo root does, and the READMEs are written in terms of that wrapper.
      - name: Package
        run: mvn -B -ntp -DskipTests package

      - name: Replay doc/examples
        run: .github/scripts/check-examples.py

      # The block under `## Options` is generated, not written: `check-help.py --write` puts it
      # there. Without the flag the script only compares, so an option added, renamed or reworded
      # without regenerating fails here rather than leaving the list stale for a reader.
      - name: Check doc/usage.md quotes the real --help
        run: .github/scripts/check-help.py

      # The manual page is written rather than generated, so what is checked is narrower: the
      # signature line of every entry against the name column of --help. An option added, renamed
      # or respelled fails here; a reworded description does not, which is the point of writing it.
      - name: Check the man page documents the real options
        run: .github/scripts/check-man.py

      - name: Show what drifted
        if: failure()
        run: git diff -- doc/examples

  # Everything the jar says about its own contents, checked against the jar. Two failures live
  # here, and neither one shows up as a broken build on its own.
  #
  # The first is a resource two dependencies both define. shade reports one as a warning, lets the
  # dependency order decide which copy survives, and carries on; the losing copy is simply absent
  # from the jar. Every such clash the build has today is settled deliberately in pom.xml, each
  # with its reason. A new dependency can introduce another at any time, and the plugin offers no
  # way to fail on one, so the gate is its own output.
  #
  # The second needs no clash at all: a dependency that stops shipping the license text NOTICE
  # points a reader at empties that path silently, and the file that documents where to look is
  # then wrong with nothing to say so.
  #
  # One platform and one JDK: the jar is the same everywhere, so what it contains does not vary
  # with either.
  packaging:
    name: shaded jar carries what it claims
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # `shell: bash` for the pipe: a `run:` without it is `bash -e {0}`, where the status of a
      # pipeline is the status of its last stage -- `tee` -- so a failed build would be read as a
      # pass. The explicit shell is `bash -eo pipefail`, which reads the build's own status.
      - name: Package
        shell: bash
        run: mvn -B -ntp -DskipTests package | tee "$RUNNER_TEMP/build.log"

      # Matching on the plugin's wording would break the day it is reworded, and break by passing.
      # The section is taken whole instead, and any warning in it fails: shade has nothing to warn
      # about here that is not worth a look.
      - name: Check shade settled every overlapping resource
        run: |
          if sed -n '/--- shade:/,/^\[INFO\] --- /p' "$RUNNER_TEMP/build.log" | grep '^\[WARNING\]'; then
            echo "maven-shade-plugin warned while merging; settle it in pom.xml <filters>" >&2
            exit 1
          fi

      - name: Check the jar carries the license texts NOTICE names
        run: .github/scripts/check-notice.py

  # A renamed section leaves the links that pointed into it aimed at an anchor which no longer
  # exists, and the rendered page gives no sign of that -- the link just lands at the top of the
  # file. An overlong code block goes just as quietly, from the other side: GitHub scrolls a block
  # rather than wrapping it, so the end of the line sits behind a scrollbar. Neither `mvn verify`
  # nor the examples job can see either one: the first tests behaviour, the second compares quoted
  # command output. This reads the documents themselves.
  #
  # No JDK and no build: the checks read tracked files as text, the Kotlin sources included, so the
  # job wants nothing but a checkout, and it finishes in under a second.
  docs:
    name: doc and KDoc links resolve, blocks fit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check every relative link and anchor resolves
        run: .github/scripts/check-links.py

      # Width is its own script and its own step, because it is its own rule: a link that goes
      # nowhere and a block too wide to read fail for unrelated reasons, and a step covering both
      # says neither when it goes red.
      - name: Check every code block fits the width it is shown at
        run: .github/scripts/check-blocks.py

      # One spelling of the punctuation dash, where the spelling is a choice: a comment reaches no
      # console, so nothing forces the ASCII form there the way MessageCharsetTest forces it on the
      # messages.
      - name: Check the punctuation dash is written one way
        run: .github/scripts/check-dashes.py

      # The question check-links.py asks of the documentation, asked of the sources. A KDoc
      # `[Symbol]` is a link, and the Kotlin compiler does not read it, so one whose target was
      # deleted goes on compiling and goes on looking authoritative. Java has had
      # `javadoc -Xdoclint` for this since JDK 8 and Kotlin has no equivalent in the compiler.
      - name: Check every KDoc link resolves
        run: .github/scripts/check-kdoc-links.py

      # Kotlin binds a KDoc to the declaration after it, so two in a row document one thing and the
      # first documents nothing. A documented function inserted between an existing KDoc and its
      # declaration makes exactly that, and compiles; an undocumented one takes the KDoc for itself,
      # which this does not see.
      - name: Check no doc comment stands on another
        run: .github/scripts/check-doc-comments.py
