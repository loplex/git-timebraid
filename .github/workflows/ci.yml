name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: verify (JDK ${{ matrix.java }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ["17", "21"]
        # jlink spells its compression differently across these two: `zip-6` needs JDK 21, and a
        # JDK 17 build has to ask for the older numeric form. A release only ever uses 21's, and the
        # numeric one is what a JDK 17 build from source needs, so both are exercised.
        include:
          - java: "17"
            jlink_compress: "2"
          - java: "21"
            jlink_compress: "zip-6"

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # The tests run `git`: for fsck, log --graph and the other commands that read what the output
      # holds, and through the program for a clone, --keep-remotes and --no-bare. It is preinstalled
      # on the GitHub-hosted runners; this just records the version.
      - name: Show git version
        run: git --version

      - name: mvn verify
        run: mvn -B -ntp verify

      # The bundled-runtime profile is the part of the build most likely to fail on a platform
      # rather than in code: it shells out to jlink, names its archive from the os/arch profiles,
      # and links a hand-written module list. Building it in the same matrix that runs the tests
      # means the archives a release uploads for Linux and Windows x64 have been built on their
      # platform already; the macOS and aarch64 archives are built only by the release workflow.
      #
      # The quotes around the property are load-bearing on Windows, where the default shell is
      # PowerShell: it ends a parameter name at a dot, so a bare -Djlink.compress=2 reaches Maven
      # as the two arguments `-Djlink` and `.compress=2` and the second is read as a lifecycle
      # phase. Bash needs no such help, and takes the quotes without complaint.
      - name: Build the bundled-runtime archive
        run: mvn -B -ntp -DskipTests -Pbundled-runtime "-Djlink.compress=${{ matrix.jlink_compress }}" package

      # jlink proves the image links, not that it runs. The script unpacks the archive a user
      # would download and merges two repositories with it; it lives in .github/scripts/ so that
      # anything else building these archives can make the very same check about them.
      - name: Merge two repositories with the unpacked archive
        shell: bash
        run: .github/scripts/smoke-distribution.sh

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-${{ matrix.os }}-jdk${{ matrix.java }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore

  # A renamed section leaves the links that pointed into it aimed at an anchor which no longer
  # exists, and the rendered page gives no sign of that -- the link just lands at the top of the
  # file. An overlong code block goes just as quietly, from the other side: GitHub scrolls a block
  # rather than wrapping it, so the end of the line sits behind a scrollbar. `mvn verify` cannot
  # see either one: it tests behaviour. This reads the documents themselves.
  #
  # No JDK and no build: the checks read tracked files as text, the Kotlin sources included, so the
  # job wants nothing but a checkout, and it finishes in under a second.
  docs:
    name: doc links resolve, blocks fit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check every relative link and anchor resolves
        run: .github/scripts/check-links.py

      # Width is its own script and its own step, because it is its own rule: a link that goes
      # nowhere and a block too wide to read fail for unrelated reasons, and a step covering both
      # says neither when it goes red.
      - name: Check every code block fits the width it is shown at
        run: .github/scripts/check-blocks.py
