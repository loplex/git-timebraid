name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: verify (JDK ${{ matrix.java }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ["17", "21"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # The integration tests shell out to `git` for fsck and log --graph; it is
      # preinstalled on the GitHub-hosted runners, this just records the version.
      - name: Show git version
        run: git --version

      - name: mvn verify
        run: mvn -B -ntp verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.os }}-jdk${{ matrix.java }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
